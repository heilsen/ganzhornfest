name: Deploy to Play Store
on:
  workflow_dispatch:
concurrency:
  group: play-store-upload
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Write local.properties
        run: echo "google_maps_key=${{ secrets.GOOGLE_MAPS_KEY }}" > local.properties
      - name: Write signing config
        env:
          UPLOAD_KEYSTORE_BASE64: ${{ secrets.UPLOAD_KEYSTORE_BASE64 }}
          KEYSTORE_STORE_PASSWORD: ${{ secrets.KEYSTORE_STORE_PASSWORD }}
          UPLOAD_KEY_ALIAS: ${{ secrets.UPLOAD_KEY_ALIAS }}
          UPLOAD_KEY_PASSWORD: ${{ secrets.UPLOAD_KEY_PASSWORD }}
        run: |
          echo "$UPLOAD_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          # Only the upload key. The build passes -PsigningConfig=upload and the
          # release config stays unconfigured.
          cat > keystore.properties <<EOF
          storeFile=$RUNNER_TEMP/upload.jks
          storePassword=$KEYSTORE_STORE_PASSWORD
          upload.keyAlias=$UPLOAD_KEY_ALIAS
          upload.keyPassword=$UPLOAD_KEY_PASSWORD
          EOF
      - name: Build release bundle
        run: ./gradlew bundleRelease -PsigningConfig=upload --stacktrace
      - name: Upload bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-bundle
          path: |
            app/build/outputs/bundle/release/app-release.aab
            app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: error
      - name: Upload to Play Store open testing
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: de.heilsen.ganzhornfest
          releaseFiles: app/build/outputs/bundle/release/app-release.aab
          mappingFile: app/build/outputs/mapping/release/mapping.txt
          track: beta
          status: completed
      - name: Remove signing material
        if: always()
        run: rm -f keystore.properties "$RUNNER_TEMP/upload.jks"
